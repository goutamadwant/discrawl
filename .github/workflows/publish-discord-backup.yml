# Diagnostic ref only. The default branch publisher remains unchanged.
name: publish-discord-backup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: discrawl-publisher-content-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/diagnostic/publisher-content-20261014'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report publisher identity and one public message's text lengths
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python3 scripts/diagnose_publisher_content.py
